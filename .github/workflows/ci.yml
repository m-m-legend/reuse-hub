name: Build and verify
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reusehub_test
          POSTGRES_USER: reusehub
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reusehub -d reusehub_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test with H2
        run: ./mvnw -B -ntp verify
      - name: Test the same suite with PostgreSQL
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/reusehub_test
          TEST_DB_USER: reusehub
          TEST_DB_PASSWORD: ci-only-password
          TEST_DB_INIT_SQL: SET lock_timeout TO '5s'
        run: ./mvnw -B -ntp verify
      - name: Build runtime image
        run: docker build -t reuse-hub:ci .
      - name: Smoke test the container over HTTP
        env:
          DB_URL: jdbc:postgresql://localhost:5432/reusehub_test
          DB_USER: reusehub
          DB_PASSWORD: ci-only-password
        run: |
          export JWT_SECRET="$(openssl rand -base64 32)"
          docker run -d --name reuse-hub-ci --network host --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true -e DB_URL -e DB_USER -e DB_PASSWORD -e JWT_SECRET -e SPRING_PROFILES_ACTIVE=prod reuse-hub:ci
          python3 scripts/demo.py
      - name: Container logs
        if: always()
        run: docker logs reuse-hub-ci || true
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
